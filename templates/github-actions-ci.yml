# .github/workflows/ci.yml
# Universal CI pipeline template — edit the sections marked with ✏️
#
# Features:
#   - Runs on every push and pull request
#   - Caches dependencies for fast re-runs
#   - Separate jobs that run in parallel (lint, test, build)
#   - Matrix testing across Node/Python versions
#   - Upload test coverage to Codecov

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # Cancel old runs when a new commit is pushed

# ────────────────────────────────────────────────────────────────────────────
# NODE.JS / JAVASCRIPT / TYPESCRIPT
# ────────────────────────────────────────────────────────────────────────────
jobs:
  node-lint-and-test:
    name: Lint & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # ✏️ Adjust or remove the matrix to suit your needs
    strategy:
      matrix:
        node: [20, 22]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm   # ✏️ Change to 'yarn' or 'pnpm' if needed

      - name: Install dependencies
        run: npm ci   # ✏️ Use 'yarn install --frozen-lockfile' or 'pnpm install --frozen-lockfile'

      - name: Lint
        run: npm run lint   # ✏️ Adjust script name

      - name: Type check
        run: npm run typecheck   # ✏️ Remove if no TypeScript

      - name: Test
        run: npm test -- --coverage   # ✏️ Adjust flags for your test runner

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.node == 20   # Only upload once
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

