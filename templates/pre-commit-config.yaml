# .pre-commit-config.yaml
# Drop this file at the root of your repo, then run:
#   pip install pre-commit
#   pre-commit install
#
# Every `git commit` will now run these checks automatically.
# To run manually against all files: pre-commit run --all-files

repos:
  # ── Universal ──────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace       # Remove trailing whitespace
      - id: end-of-file-fixer         # Ensure files end with a newline
      - id: check-yaml                # Validate YAML syntax
      - id: check-json                # Validate JSON syntax
      - id: check-toml                # Validate TOML syntax
      - id: check-merge-conflict      # Catch leftover merge conflict markers
      - id: check-added-large-files   # Block files > 500 KB from being committed
        args: ['--maxkb=500']
      - id: detect-private-key        # Prevent committing private keys
      - id: mixed-line-ending         # Normalize line endings
        args: ['--fix=lf']

  # ── Secrets detection ──────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ── Conventional commits ───────────────────────────────────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, test, chore, ci, build, perf, revert]

