# .github/workflows/release.yml
# Automated semantic release pipeline.
#
# Triggered when you push to main/master.
# Uses conventional commits to determine the next version and generates
# a changelog, GitHub Release, and (optionally) publishes a package.
#
# Requires: commits follow Conventional Commits spec (feat:, fix:, chore:, etc.)
# Setup:
#   1. Copy this file to .github/workflows/release.yml
#   2. Add secrets as noted below
#   3. Uncomment the publish step for your stack

name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write        # Create releases and tags
  pull-requests: write   # Update PR with release notes
  issues: write          # Create/update issues

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Full history needed for changelog
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # python-semantic-release is the alternative for Python projects.
      # Comment out the node steps and uncomment the python steps below.
      - name: Run semantic-release
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        # ✏️ For Node.js projects use: cycjimmy/semantic-release-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # ✏️ Uncomment if you want to publish to PyPI:
          # repository_username: __token__
          # repository_password: ${{ secrets.PYPI_TOKEN }}

